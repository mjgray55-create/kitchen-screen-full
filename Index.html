      '<button class="btn quiet" data-addrow="sOcc">+ Add a date</button></div>' +
    '<div class="set-card"><h2>Falling decorations</h2><p class="sub">Leaves, snow, fireflies and so on, drifting behind the menu. The colours and birthday cards stay either way.</p>' +
      '<div class="chips" id="sDeco">' + [['always', 'All year'], ['special', 'Only on special days'], ['off', 'Off']].map(function (t) {
        return '<button class="chip' + ((s.decorations || 'always') === t[0] ? ' on' : '') + '" data-v="' + t[0] + '">' + t[1] + '</button>'; }).join('') +
      '</div><p class="hint">Tip: tap the clock five times to preview every look.</p></div></div>' +
    '<div class="acts" style="display:flex;justify-content:flex-end;gap:12px;margin:6px 0 26px"><button class="btn primary" id="sSave">' + (firstTime ? 'Done — start using it' : 'Save settings') + '</button></div>' +

    (firstTime || !feat('recipes') ? '' :
    '<div class="set-card"><h2>Recipes from a file</h2><p class="sub">Bring in recipes from an HTML recipe file saved on this tablet. Any whose name is already in the book are skipped.</p>' +
      '<div class="acts"><button class="btn" id="rImport">Import recipes from a file…</button></div></div>') +
    '<div class="set-card"><h2>Your data</h2><p class="sub">Everything on this screen lives in your Kitchen Google Sheet. Google keeps its own version history ' +
      '(in the sheet: File → Version history), so there\'s nothing to back up by hand. You can also change any of these settings on the sheet\'s Settings tab.</p></div>' +
    '<input type="file" id="recIn" accept=".html,.htm,text/html" style="display:none">';

      box.insertAdjacentHTML('beforeend', h); var ins = box.lastElementChild.querySelector('input'); if (ins) ins.focus();

  $('sSave').onclick = function () {

    var cooks = vals('#sCooks .lrow').map(function (v) { return v[0]; }).filter(Boolean);

    });

    var frz = vals('#sFrz .lrow').filter(function (v) { return v[0] || v[1]; });
    var bad = frz.filter(function (v) { return !v[0] || !v[1]; })[0];
    if (bad) { toast('Each freezer needs a code and a name.', true); return; }
    frz = frz.map(function (v) { return { code: v[0].toUpperCase().replace(/\s+/g, ''), name: v[1] }; });
    if (!frz.length) { toast('Add at least one freezer.', true); return; }
    var codes = frz.map(function (f) { return f.code; });
    if (codes.some(function (c, i) { return codes.indexOf(c) !== i; })) { toast('Two freezers have the same code.', true); return; }
    var inUse = {}; D.freezer.categories.forEach(function (c) { c.items.forEach(function (it) { inUse[it.f] = (inUse[it.f] || 0) + 1; }); });
    var gone = Object.keys(inUse).filter(function (c) { return c && codes.indexOf(c) < 0 && FCODES.indexOf(c) >= 0; })[0];
    if (gone) { toast('The ' + fname(gone) + ' still has ' + inUse[gone] + ' thing' + (inUse[gone] === 1 ? '' : 's') + ' in it. Move or remove them first.', true); return; }
    var heads = [], renames = [];
    root.querySelectorAll('#sHeads [data-orig]').forEach(function (w) {
      var v = w.querySelector('input').value.trim(), o = w.dataset.orig;
      if (v && heads.indexOf(v) < 0) heads.push(v);
      if (o && v && o !== v) renames.push([o, v]);
    });
    if (!heads.length) { toast('Add at least one freezer heading.', true); return; }
    var stillUsed = D.freezer.categories.filter(function (c) {
      return c.items.length && heads.indexOf(c.name) < 0 && !renames.some(function (r) { return r[0] === c.name; });
    })[0];
    if (stillUsed) { toast('“' + stillUsed.name + '” still has things under it. Move or remove them first.', true); return; }
    var btn = this; btn.disabled = true; setSync('Saving…'); state.busy = true;
    call('saveSettings', { household: $('sHouse').value.trim(), theme: theme, tier: tier, features: features,
      cooks: cooks, freezers: frz, headings: heads, occasions: occ, decorations: decorations, setupDone: true }, renames)
      .then(function (d) {
        state.busy = false; apply(d);
        if (firstTime) { document.body.classList.remove('welcome'); go('menu'); toast('All set. Enjoy your kitchen screen.'); }
        else { renderSettings(); toast('Settings saved.'); }
      })
      .catch(function (e) { state.busy = false; btn.disabled = false; setSync('Not saved', true); toast((e && e.message) || 'Couldn\'t save the settings.', true); });
  };

  if ($('rImport')) {
    $('rImport').onclick = function () { $('recIn').click(); };
    $('recIn').onchange = function () { importRecipeFile(this.files[0]); this.value = ''; };
  }
}

function readFile(file) {
  return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(r.result); }; r.onerror = rej; r.readAsText(file); });
}

function importRecipeFile(file) {
  if (!file) return;
  readFile(file).then(function (html) {
    var got = parseRecipes(html).recipes.filter(function (r) { return r.title && r.html.trim(); })
      .map(function (r) { return { title: r.title, section: r.section, html: r.html }; });
    if (!got.length) { toast('No recipes found in that file.', true); return; }
    toast('Adding recipes…');
    return call('importRecipes', got).then(function (n) {
      loadRecipes(); toast(n ? 'Added ' + n + ' recipe' + (n === 1 ? '' : 's') + '.' : 'Those recipes are already in the book.');
    });
  }).catch(function (e) { toast((e && e.message) || 'Couldn\'t read that file.', true); });
}

function showWelcome() {
  document.body.classList.add('welcome');
  $('welcome').innerHTML = '<h1>Hello, kitchen.</h1>' +
    '<p>This screen keeps the week\'s menu, the shopping list and kitchen timers, and can also track the fridge, freezer and recipes. ' +
    'Everything is saved in your Kitchen Google Sheet, so you can also open the sheet on your phone to check the shopping list at the store.</p>' +
    '<div class="acts"><button class="btn primary" id="wSetup">Set up this kitchen</button></div>';
  $('wSetup').onclick = function () { go('settings'); renderSettings(true); };
  go('welcome');
}

/* =========================================================
   LOOKS — the screen dresses itself for the season, holidays and birthdays
   ========================================================= */
var MONTHS = ['january', 'february', 'march', 'april', 'may', 'june', 'july', 'august', 'september', 'october', 'november', 'december'];
var LOOK = { preview: null, key: '' };

function md(d) { return (d.getMonth() + 1) * 100 + d.getDate(); }            // 13 July → 713
function addDays(d, n) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; }
function nthWeekday(y, m, wd, n) { var d = new Date(y, m, 1); while (d.getDay() !== wd) d.setDate(d.getDate() + 1); d.setDate(d.getDate() + 7 * (n - 1)); return d; }
function easter(y) {  // Anonymous Gregorian computus
  var a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25),
    g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4,
    l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451), mo = Math.floor((h + l - 7 * m + 114) / 31);
  return new Date(y, mo - 1, ((h + l - 7 * m + 114) % 31) + 1);
}
function sameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }

/* "July 13", "13 July", "Jul 13", "7/13", "7/13/1980", "1980-07-13" → month/day */
function parseBday(s) {
  s = String(s || '').trim().toLowerCase(); var m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return { m: +m[2], d: +m[3] };
  if ((m = s.match(/^(\d{1,2})\/(\d{1,2})/))) return { m: +m[1], d: +m[2] };
  var mi = -1; MONTHS.forEach(function (n, i) { if (mi < 0 && s.indexOf(n.slice(0, 3)) >= 0) mi = i; });
  if (mi >= 0 && (m = s.match(/\d{1,2}/))) return { m: mi + 1, d: +m[0] };
  return null;
}

/* The holiday a given day falls in, if any: [class, label, emoji, isTheDay] */
function holidayFor(d) {
  var y = d.getFullYear(), v = md(d);
  var tg = nthWeekday(y, 10, 4, 4), es = easter(y);
  if (v >= 1020 && v <= 1031) return ['halloween', 'Halloween', '🎃', v === 1031];
  if (d >= tg && d <= addDays(tg, 3)) return ['thanksgiving', 'Thanksgiving', '🦃', sameDay(d, tg)];
  if (v >= 1201 && v <= 1225) return ['christmas', v === 1224 ? 'Christmas Eve' : 'Christmas', '🎄', v >= 1224];
  if (v === 1231 || v === 101) return ['newyear', v === 1231 ? 'New Year\'s Eve' : 'New Year\'s Day', '🎉', true];
  if (v >= 212 && v <= 214) return ['valentine', 'Valentine\'s Day', '💕', v === 214];
  if (v === 317) return ['stpatrick', 'St Patrick\'s Day', '☘️', true];
  if (d >= addDays(es, -2) && d <= addDays(es, 1)) return ['easter', sameDay(d, addDays(es, -2)) ? 'Good Friday' : sameDay(d, addDays(es, 1)) ? 'Easter Monday' : 'Easter', '🌷', sameDay(d, es)];
  if (v >= 701 && v <= 704) return ['july4', 'Fourth of July', '🎆', v === 704];
  return null;
}
function seasonFor(d) { var m = d.getMonth(); return m === 11 || m < 2 ? 'winter' : m < 5 ? 'spring' : m < 8 ? 'summer' : 'autumn'; }
function birthdaysOn(d) {
  return ((D && D.settings && D.settings.occasions) || []).filter(function (b) { var p = parseBday(b.date); return p && p.m === d.getMonth() + 1 && p.d === d.getDate(); });
}
function isPet(b) { return /dog|cat|pet/i.test(b.who || ''); }
function names(list) { var n = list.map(function (b) { return b.name; }); return n.length < 2 ? n[0] || '' : n.slice(0, -1).join(', ') + ' and ' + n[n.length - 1]; }

var PARTICLES = {
  autumn: { chars: ['🍂', '🍁', '🍂'], n: 12, op: 0.55 },
  winter: { chars: ['❄', '❅', '❆'], n: 16, op: 0.45, color: '#cfe3f3' },
  spring: { chars: ['🌸', '🌼', '🌸'], n: 11, op: 0.5 },
  summer: { dots: '#f6d77a', n: 14, op: 0.55 },
  halloween: { chars: ['🦇', '🍂', '🦇', '🎃'], n: 12, op: 0.55 },
  thanksgiving: { chars: ['🦃', '🥧', '🌽', '🍂'], n: 12, op: 0.55 },
  anniversary: { chars: ['💕', '✨', '❤️'], n: 12, op: 0.5, rise: true },
  christmas: { chars: ['❄', '❅', '❆', '✨'], n: 18, op: 0.5, color: '#e9f2fb' },
  newyear: { chars: ['✨', '🎉', '✨'], n: 14, op: 0.55 },
  valentine: { chars: ['💕', '❤️', '💗'], n: 11, op: 0.45, rise: true },
  stpatrick: { chars: ['☘️', '🍀'], n: 11, op: 0.5 },
  easter: { chars: ['🌷', '🌸', '🦋', '🌼'], n: 11, op: 0.5 },
  july4: { chars: ['⭐', '✨', '⭐'], n: 14, op: 0.55 },
  bday: { chars: ['🎈', '🎈', '🎉'], n: 10, op: 0.6, rise: true },
  bdaypet: { chars: ['🐾', '🦴', '🐾'], n: 12, op: 0.5 }
};
function particles(kind) {
  var box = $('deco'), p = PARTICLES[kind];
  if (!p) { box.innerHTML = ''; return; }
  box.className = 'deco' + (p.rise ? ' rise' : '');
  box.style.setProperty('--deco-op', p.op);
  var html = '';
  for (var i = 0; i < p.n; i++) {
    var left = Math.round((i + Math.random()) * 100 / p.n), dur = 16 + Math.random() * 14, delay = -Math.random() * dur;
    var size = 14 + Math.round(Math.random() * 14), sway = Math.round(Math.random() * 120 - 60);
    if (p.dots) html += '<i class="dot" style="left:' + left + '%;top:' + Math.round(10 + Math.random() * 85) + '%;--dot:' + p.dots + ';--sway:' + sway + 'px;animation-duration:' + (4 + Math.random() * 5).toFixed(1) + 's;animation-delay:' + (-Math.random() * 8).toFixed(1) + 's"></i>';
    else html += '<i style="left:' + left + '%;font-size:' + size + 'px;--sway:' + sway + 'px;animation-duration:' + dur.toFixed(1) + 's;animation-delay:' + delay.toFixed(1) + 's' + (p.color ? ';color:' + p.color : '') + '">' + p.chars[i % p.chars.length] + '</i>';
  }
  box.innerHTML = html;
}

function confetti(pet) {
  var cols = ['#ef6a5e', '#f2b45c', '#a9d38e', '#9cc3e0', '#c6a9ee', '#f28aab'];
  for (var i = 0; i < (pet ? 26 : 70); i++) {
    var c = document.createElement('div');
    c.className = 'confetti' + (pet ? ' e' : '');
    if (pet) c.textContent = ['🐾', '🦴', '🐾', '❤️'][i % 4];
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = cols[i % cols.length];
    c.style.setProperty('--dx', Math.round(Math.random() * 240 - 120) + 'px');
    c.style.setProperty('--rot', Math.round(Math.random() * 900 - 450) + 'deg');
    c.style.animationDelay = (Math.random() * 0.9).toFixed(2) + 's';
    document.body.appendChild(c);
    setTimeout(function (x) { return function () { x.remove(); }; }(c), 4600);
  }
}

/* Work out today's look and dress the screen in it. Runs on load, each refresh and at midnight. */
function applyOccasionLook() {
  if (!feat('looks') && !LOOK.preview) {
    document.body.className = document.body.className.replace(/\b(season|hol)-\S+|\bbday\b|\banniv\b/g, '').trim();
    $('clockOcc').textContent = ''; $('deco').innerHTML = ''; LOOK.key = ''; return;
  }
  var d = LOOK.preview ? LOOK.preview.date : new Date();
  var season = seasonFor(d), hol = holidayFor(d), all = occasionsOn(d);
  var an = all.filter(isAnniv), bd = all.filter(function (b) { return !isAnniv(b); });
  var allPets = bd.length && bd.every(isPet);
  var cls = ['season-' + season]; if (hol) cls.push('hol-' + hol[0]); if (bd.length) cls.push('bday'); if (an.length) cls.push('anniv');
  var deco = (D && D.settings.decorations) || 'always', special = bd.length || an.length || hol;
  var still = deco === 'off' || (deco === 'special' && !special);
  var key = cls.join(' ') + '|' + names(all) + '|' + deco;
  document.body.classList.toggle('nodeco', still);
  document.body.className = document.body.className.replace(/\b(season|hol)-\S+|\bbday\b|\banniv\b/g, '').trim() + ' ' + cls.join(' ');
  $('clockOcc').textContent = bd.length ? (allPets ? '🐾 ' : '🎂 ') + names(bd) + '\'s birthday' : an.length ? '💍 Anniversary' : hol ? hol[2] + ' ' + hol[1] : '';
  if (key !== LOOK.key) {
    var first = !LOOK.key;
    LOOK.key = key;
    particles(still ? null : bd.length ? (allPets ? 'bdaypet' : 'bday') : an.length ? 'anniversary' : hol ? hol[0] : season);
    if (all.length && (first || LOOK.preview)) setTimeout(function () { confetti(allPets && !an.length); }, 700);
  }
}

/* Birthdays and anniversaries on a day (the preview can stand in for today) */
function occasionsOn(d) {
  var today = LOOK.preview ? LOOK.preview.date : new Date();
  if (LOOK.preview && LOOK.preview.bday && sameDay(d, today)) return [LOOK.preview.bday];
  return birthdaysOn(d);
}
function isAnniv(b) { return /anniv|wedding/i.test(b.who || ''); }
function occIcon(b) { return isAnniv(b) ? '💍 ' : isPet(b) ? '🐾 ' : '🎂 '; }
function occWhat(b) { return isAnniv(b) ? b.name + '\'s anniversary' : b.name + '\'s birthday'; }

/* Lines for the menu: a card on the day, and a heads-up for what's coming soon */
function renderOccasions() {
  var box = $('bdayCard'); if (!box) return;
  if (!feat('looks') && !LOOK.preview) { box.innerHTML = ''; return; }
  var d = LOOK.preview ? LOOK.preview.date : new Date();
  var all = occasionsOn(d), an = all.filter(isAnniv), bd = all.filter(function (b) { return !isAnniv(b); });
  var cards = '';
  if (bd.length) {
    var pets = bd.every(isPet);
    cards += '<div class="bday-card" data-confetti="' + (pets ? 1 : 0) + '"><div class="big">' + (pets ? '🐾' : '🎂') + '</div><div class="q">Happy birthday, ' + esc(names(bd)) + '!' +
      '<small>' + (pets ? 'Extra treats and a long walk are in order. Tap for a party.' : 'Plan something good for dinner. Tap for a party.') + '</small></div></div>';
  }
  if (an.length) {
    cards += '<div class="bday-card" data-confetti="0"><div class="big">💍</div><div class="q">Happy anniversary, ' + esc(names(an)) + '!' +
      '<small>Here\'s to another year together. Tap for a party.</small></div></div>';
  }
  box.innerHTML = cards;
  var soon = [];
  for (var i = 1; i <= 14; i++) { var day = addDays(d, i); birthdaysOn(day).forEach(function (b) { soon.push({ b: b, i: i, day: day }); }); }
  var sub = 'Tap a meal to change it';
  if (soon.length) {
    var s0 = soon[0], when = s0.i === 1 ? 'tomorrow' : s0.i < 7 ? 'on ' + s0.day.toLocaleDateString([], { weekday: 'long' }) : 'on ' + s0.day.toLocaleDateString([], { month: 'long', day: 'numeric' });
    sub = occIcon(s0.b) + occWhat(s0.b) + ' is ' + when;
  }
  $('menuSub').textContent = sub;
}

/* Little labels under each day of this week: birthdays, anniversaries and holiday days */
function dayOccasion(i) {
  if (!feat('looks') && !LOOK.preview) return '';
  var base = LOOK.preview ? LOOK.preview.date : new Date();
  var d = addDays(base, i - todayIdx());
  var bits = occasionsOn(d).map(function (b) { return occIcon(b) + (isAnniv(b) ? 'Anniversary' : b.name); });
  var h = holidayFor(d); if (h && h[3]) bits.push(h[2] + ' ' + h[1]);
  return bits.join(' · ');
}

/* Tap the clock five times to try the looks (handy for showing people) */
var LOOK_DEMOS = [
  ['Today', null], ['Autumn', '2026-10-05'], ['Halloween', '2026-10-31'], ['Thanksgiving', '2026-11-26'],
  ['Winter', '2027-01-15'], ['Christmas', '2026-12-23'], ['New Year', '2026-12-31'], ['Valentine\'s', '2027-02-14'], ['St Patrick\'s', '2027-03-17'],
  ['Spring', '2027-04-15'], ['Easter', '2027-03-28'], ['Summer', '2027-06-20'], ['Fourth of July', '2027-07-04'],
  ['A birthday', 'bday'], ['A dog\'s birthday', 'pet'], ['Anniversary', 'anniv']
];
function lookPicker() {
  openSheet('<h2>Try a look</h2><p class="sub">The screen changes on its own by date. Pick one to preview it, then come back to today.</p><div class="chips">' +
    LOOK_DEMOS.map(function (x, i) { return '<button class="chip" data-look="' + i + '">' + esc(x[0]) + '</button>'; }).join('') +
    '</div><div class="acts"><button class="btn" data-x>Close</button></div>', function (s) {
      s.querySelector('[data-x]').onclick = closeSheet;
      s.querySelectorAll('[data-look]').forEach(function (b) {
        b.onclick = function () {
          var v = LOOK_DEMOS[+b.dataset.look][1];
          if (!v) LOOK.preview = null;
          else if (v === 'bday') LOOK.preview = { date: new Date(), bday: { name: 'Someone', who: 'Person' } };
          else if (v === 'pet') LOOK.preview = { date: new Date(), bday: { name: 'The dog', who: 'Dog' } };
          else if (v === 'anniv') LOOK.preview = { date: new Date(), bday: { name: 'You two', who: 'Anniversary' } };
          else { var p = v.split('-'); LOOK.preview = { date: new Date(+p[0], +p[1] - 1, +p[2]) }; }
          closeSheet(); applyOccasionLook(); renderMenu();
          if (LOOK.preview) toast('Previewing ' + LOOK_DEMOS[+b.dataset.look][0] + '. Tap the clock 5 times to go back.');
        };
      });
    });
}
(function () {
  var taps = [];
  // count touch-downs, not clicks: in landscape the clock sits at the screen's top edge,
  // where the tablet often treats a tap as the start of a swipe and never sends the click
  document.addEventListener('pointerdown', function (e) {
    if (!e.isPrimary || !e.target.closest('.clock')) return;
    var now = Date.now(); taps = taps.filter(function (t) { return now - t < 3000; }); taps.push(now);
    if (taps.length >= 5) { taps = []; lookPicker(); }
  });
  document.addEventListener('click', function (e) {
    var c = e.target.closest('[data-confetti]'); if (c) confetti(c.dataset.confetti === '1');
  });
})();


/* =========================================================
   wiring
   ========================================================= */
function renderAll() {
  if (!D) return;
  renderMenu(); renderFreezer(); renderFridge(); renderShopping(); renderMeals();
}

document.addEventListener('click', function (e) {
  var t = e.target;
  var tab = t.closest('.tab[data-page]'); if (tab) { go(tab.dataset.page); return; }
  if (t.closest('#timerBtn')) { timerPicker(); return; }
  if (t.closest('#scrim')) { closeSheet(); return; }
  var tm = t.closest('.timer');
  if (tm) {
    var id = +tm.dataset.id;
    if (t.closest('[data-plus]')) timers.forEach(function (x) { if (x.id === id) x.end += 60000; });
    else timers = timers.filter(function (x) { return x.id !== id; });
    renderTimers(); return;
  }
  var rl = t.closest('[data-recipe]');
  if (rl && !t.closest('#sheet') && !t.closest('.eat') && !t.closest('[data-cook]')) { e.stopPropagation(); showRecipe(rl.dataset.recipe); return; }
  var eb = t.closest('.eat'); if (eb) { eatItem(+eb.dataset.day, eb.dataset.slot, eb.dataset.eat); return; }
  var ck = t.closest('[data-cook]'); if (ck) { pickCook(+ck.dataset.cook); return; }
  var slot = t.closest('#week [data-slot]'); if (slot) { pickMeal(+slot.dataset.day, slot.dataset.slot); return; }
  var lc = t.closest('.lcard'); if (lc) { leftoverDetail(+lc.dataset.lo); return; }
  if (t.closest('#loAdd')) { leftoverAdd(); return; }
  if (t.closest('#clearWeek')) { confirmSheet('Clear the week?', 'Empties every lunch, dinner and note so you can plan fresh. The meals list isn\'t touched.', 'Clear it', function () { act('clearMenu'); }); return; }
  if (t.closest('#recView')) { recipeTap(e); return; }
  var fc = t.closest('#frzChips [data-f]'); if (fc) { state.frzFilter = fc.dataset.f; renderFreezer(); return; }
  var fi = t.closest('.fitem'); if (fi) { freezerItem(+fi.dataset.row); return; }
  if (t.closest('#frzAdd')) { freezerAdd(); return; }
  var si = t.closest('.sitem');
  if (si) {
    var x = D.shopping.filter(function (s) { return s.row === +si.dataset.row; })[0];
    if (x) { x.done = !x.done; renderShopping(); act('setShoppingDone', x.row, x.item, x.done); }
    return;
  }
  if (t.closest('#clearTicked')) { act('clearTicked'); return; }
  if (t.closest('#mealAdd')) { mealForm(); return; }
  if (t.closest('#recAdd')) { recipeForm(null); return; }
  var mc = t.closest('.mcard'); if (mc) { mealDetail(+mc.dataset.row); return; }
});

$('shopForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var it = $('shopItem').value.trim(); if (!it) return;
  var q = $('shopQty').value.trim(), w = $('shopWhere').value.trim();
  $('shopItem').value = ''; $('shopQty').value = ''; $('shopWhere').value = '';
  act('addShopping', it, q, w);
});
$('recSearch').addEventListener('input', renderRecipeIndex);
$('frzSearch').addEventListener('input', function () { if (D) renderFreezer(); });

/* The clock, and a fresh look at the week when the day changes */
var lastDay = today();
tick(); setInterval(function () {
  tick();
  if (today() !== lastDay) { lastDay = today(); if (D) { applyOccasionLook(); if (!sheetOpen()) renderAll(); } }
}, 10000);
setInterval(timerLoop, 500);

/* Keep in step with the sheet (someone may have added to the shopping list from their phone):
   every minute, unless someone is mid-tap. Recipes change less often, so hourly. */
setInterval(function () {
  if (state.busy || sheetOpen() || state.page === 'settings' || document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  refresh();
}, 60000);
setInterval(function () { if (D && feat('recipes')) loadRecipes(); }, 60 * 60000);
if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { if (D) applyLook(); }); } catch (e) {} }

refresh().then(function () { if (D && !D.settings.setupDone) showWelcome(); });
loadRecipes();
</script>
